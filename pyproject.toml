[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "venturevaluator"
version = "0.2.0"
description = "Multi-agent startup pitch-deck diligence and valuation platform"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "ddgs>=9.0.0,<10",
    "fpdf>=1.7.2,<2",
    "httpx>=0.27,<1",
    "login-with-chatgpt==0.1.2",
    "mcp>=1.0.0,<2",
    "openai>=2.45.0,<3",
    "pdfplumber>=0.11,<1",
    "plotly>=5.18,<7",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "python-dotenv>=1.0,<2",
    "python-pptx>=1.0,<2",
    "streamlit>=1.48,<2",
    "yfinance>=0.2.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
include = ["agents*", "app*", "core*", "tools*"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config -ra"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
branch = true
source = ["agents", "app", "core", "tools"]
omit = [
    "app/components.py",
    "app/pages/*",
    "app/styles.py",
    "app/ui.py",
    "tools/auth_status.py",
    "tools/llm_client.py",
    "tools/mcp_client.py",
    "tools/pdf_reader.py",
    "tools/web_search.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 55

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["venv", "node_modules"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"app/components.py" = ["E402"]
"app/pages/*.py" = ["E402"]
"app/ui.py" = ["E402"]
